<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="35%" stop-color="#F3E5AB" />
      <stop offset="70%" stop-color="#B68D40" />
      <stop offset="100%" stop-color="#8F6B27" />
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#8F6B27" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Monogram Icon (Interlocking C & A) -->
  <g transform="translate(15, 12)" filter="url(#softGlow)">
    <!-- Outer Shield/Frame Accent -->
    <path d="M10 24 C10 12 18 6 30 6 L64 6 C76 6 84 14 84 26 L84 60 C84 72 76 80 64 80 L30 80 C18 80 10 72 10 60 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Interlocking C & A Geometric Art Deco lines -->
    <path d="M52 22 L26 22 C18 22 18 34 26 34 L68 34 C76 34 76 52 68 52 L26 52 C18 52 18 64 26 64 L52 64" 
          fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M48 22 L48 64" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Center Diamond Sparkle -->
    <polygon points="48,8 51,14 48,20 45,14" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography: CasaArt INTERIOR DESIGN -->
  <g transform="translate(115, 20)">
    <!-- CasaArt Brand Name -->
    <text x="0" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5" fill="#141413">
      Casa<tspan fill="url(#goldGrad)">Art</tspan>
    </text>
    
    <!-- Subtitle Line & Tagline -->
    <g transform="translate(2, 58)">
      <line x1="0" y1="6" x2="38" y2="6" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
      <text x="48" y="10" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="3.5" fill="#8F6B27">
        INTERIOR DESIGN
      </text>
      <line x1="216" y1="6" x2="254" y2="6" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
